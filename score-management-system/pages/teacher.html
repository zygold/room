/* Score Management System - Brand CSS */
/* Professional, clean, data-dense administrative interface */

:root {
  /* Brand Primary - Indigo Blue */
  --color-primary-50: #eef2ff;
  --color-primary-100: #e0e7ff;
  --color-primary-200: #c7d2fe;
  --color-primary-300: #a5b4fc;
  --color-primary-400: #818cf8;
  --color-primary-500: #4f46e5;
  --color-primary-600: #4338ca;
  --color-primary-700: #3730a3;
  --color-primary-800: #312e81;
  --color-primary-900: #1e1b4b;

  /* Neutral Scale */
  --color-neutral-0: #ffffff;
  --color-neutral-50: #f8fafc;
  --color-neutral-100: #f1f5f9;
  --color-neutral-200: #e2e8f0;
  --color-neutral-300: #cbd5e1;
  --color-neutral-400: #94a3b8;
  --color-neutral-500: #64748b;
  --color-neutral-600: #475569;
  --color-neutral-700: #334155;
  --color-neutral-800: #1e293b;
  --color-neutral-900: #0f172a;

  /* State Colors */
  --state-success: #16a34a;
  --state-warning: #d97706;
  --state-error: #dc2626;
  --state-info: #2563eb;

  /* Radius Scale */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* Typography */
  --font-heading: 'Inter', 'Noto Sans SC', system-ui, sans-serif;
  --font-body: 'Inter', 'Noto Sans SC', system-ui, sans-serif;

  /* Semantic Aliases */
  --background: #f8fafc;
  --foreground: #0f172a;
  --card: #ffffff;
  --card-foreground: #0f172a;
  --popover: #ffffff;
  --popover-foreground: #0f172a;
  --primary: #4f46e5;
  --primary-foreground: #ffffff;
  --muted: #f1f5f9;
  --muted-foreground: #64748b;
  --border: #e2e8f0;
  --input: #e2e8f0;
  --ring: #4f46e5;
  --radius-small: 4px;
  --radius-medium: 8px;
  --radius-large: 12px;
}

.dark {
  --background: #0f172a;
  --foreground: #f8fafc;
  --card: #1e293b;
  --card-foreground: #f8fafc;
  --popover: #1e293b;
  --popover-foreground: #f8fafc;
  --primary: #818cf8;
  --primary-foreground: #0f172a;
  --muted: #334155;
  --muted-foreground: #94a3b8;
  --border: #334155;
  --input: #334155;
  --ring: #818cf8;
}

      <div class="col-span-2">
        <label class="block text-xs font-medium mb-1" style="color: var(--color-neutral-600);">学年</label>
        <select id="sy-select" class="w-full px-3 py-2 rounded-lg text-sm"
                style="background: var(--color-neutral-50); border: 1px solid var(--color-neutral-200); color: var(--color-neutral-800);"></select>
      </div>
      <div class="col-span-2">
        <label class="block text-xs font-medium mb-1" style="color: var(--color-neutral-600);">学期</label>
        <select id="sm-select" class="w-full px-3 py-2 rounded-lg text-sm"
                style="background: var(--color-neutral-50); border: 1px solid var(--color-neutral-200); color: var(--color-neutral-800);"></select>
      </div>
      <div class="col-span-5 flex gap-2">
        <button id="btn-run" class="px-5 py-2 rounded-lg text-sm font-medium whitespace-nowrap"
                style="background: var(--color-primary-600); color: white;">查询</button>
        <button id="btn-reset" class="px-4 py-2 rounded-lg text-sm whitespace-nowrap"
                style="background: var(--color-neutral-100); color: var(--color-neutral-700); border: 1px solid var(--color-neutral-200);">重置</button>
        <button id="btn-export" class="px-4 py-2 rounded-lg text-sm whitespace-nowrap"
                style="background: var(--color-neutral-100); color: var(--color-neutral-700); border: 1px solid var(--color-neutral-200);">导出 CSV</button>
      </div>
    </div>
  </div>
  <!-- 卡片列表 -->
  <div id="result-section" class="hidden space-y-4"></div>
  <div id="empty-hint" class="text-center py-16 text-sm" style="color: var(--color-neutral-400);">选择考试后点击"查询"</div>
</div>
<!-- 结果表格 -->
  <div class="rounded-xl overflow-hidden" style="background: var(--color-neutral-0); border: 1px solid var(--color-neutral-200);">
    <div class="flex items-center justify-between px-5 py-3"
         style="background: var(--color-neutral-50); border-bottom: 1px solid var(--color-neutral-200);">
      <h2 class="text-sm font-semibold" style="color: var(--color-neutral-700);">班级组合统计 <span id="row-count" class="text-xs font-normal ml-2" style="color: var(--color-neutral-500);"></span></h2>
      <div id="status-msg" class="text-xs" style="color: var(--color-neutral-500);">等待查询</div>
    </div>
    <div class="overflow-x-auto" style="max-height: 640px;">
      <table id="result-table" class="w-full text-sm">
        <thead id="result-thead" class="sticky top-0" style="background: var(--color-neutral-100); z-index: 1;">
          <tr id="thead-row"></tr>
        </thead>
        <tbody id="result-tbody"></tbody>
      </table>
    </div>
    <div id="empty-hint" class="hidden text-center py-16 text-sm" style="color: var(--color-neutral-400);">
      请选择考试后点击"查询统计"
    </div>
  </div>
</div>

  </div>
</div>

    <!-- Generic Confirm Modal -->
    <div id="generic-confirm-modal" style="display:none; position:fixed; inset:0; background-color:rgba(0,0,0,0.5); z-index:60; overflow-y:auto; padding: 1rem; align-items:flex-start; justify-content:center;">
      <div class="rounded-lg border p-6" style="background-color: var(--card); border-color: var(--border); width: 100%; max-width: 360px; max-height: calc(100vh - 2rem); overflow-y:auto; margin: auto;">
        <h3 id="generic-confirm-title" style="font-size: 16px; font-weight: 600; color: var(--foreground); margin-bottom: 0.75rem;">确认操作</h3>
        <p id="generic-confirm-message" style="font-size: 14px; color: var(--foreground); line-height: 1.5; white-space:pre-wrap;"></p>
        <div class="flex items-center justify-end gap-3 mt-6">
          <button id="generic-confirm-cancel" class="px-4 py-2 rounded-md text-sm font-medium" style="background-color: transparent; color: var(--foreground); border: 1px solid var(--border);">取消</button>
          <button id="generic-confirm-ok" class="px-4 py-2 rounded-md text-sm font-medium" style="background-color: var(--state-error); color: #fff;">确认</button>
        </div>
      </div>
    </div>

    <!-- Generic Message Modal -->
    <div id="generic-message-modal" style="display:none; position:fixed; inset:0; background-color:rgba(0,0,0,0.5); z-index:60; overflow-y:auto; padding: 1rem; align-items:flex-start; justify-content:center;">
      <div class="rounded-lg border p-6" style="background-color: var(--card); border-color: var(--border); width: 100%; max-width: 420px; max-height: calc(100vh - 2rem); overflow-y:auto; margin: auto;">
        <h3 id="generic-message-title" style="font-size: 16px; font-weight: 600; color: var(--foreground); margin-bottom: 0.75rem;">提示</h3>
        <p id="generic-message-body" style="font-size: 14px; color: var(--foreground); line-height: 1.5; white-space:pre-wrap;"></p>
        <div class="flex items-center justify-end mt-6">
          <button id="generic-message-ok" class="px-4 py-2 rounded-md text-sm font-medium" style="background-color: var(--primary); color: var(--primary-foreground);">知道了</button>
        </div>
      </div>
    </div>

    </main>

    <script>
(function(){
  const API="/api";
  const $=(id)=>document.getElementById(id);
  const state={examId:null, sy:null, sm:null, items:[]};

  // ---- Auth interceptor ----
  const _origFetch = window.fetch.bind(window);
  window.fetch = function(...args){
    return _origFetch(...args).then(resp=>{
      if(resp.status === 401 && resp.url.includes('/api/')){
        const rd = encodeURIComponent(window.location.pathname + window.location.search);
        window.location.href = '/pages/login.html?redirect=' + rd;
        return resp;
      }
      return resp;
    });
  };
  (async function initAuth(){
    try{
      const r = await _origFetch('/api/auth/me',{credentials:'include'});
      const d = await r.json();
      if(d.user){
        const topBar = document.querySelector('header .flex.items-center.justify-between');
        if(topBar){
          const right = topBar.querySelector(':scope > div:last-child');
          if(right){
            right.insertAdjacentHTML('beforeend',
              `<span class="ml-3 text-xs" style="color:var(--color-neutral-500);">你好, <b style="color:var(--color-neutral-800);">${d.user.display_name||d.user.username}</b></span>
               <button id="btn-logout" class="ml-2 text-xs px-2 py-1 rounded"
                       style="color:var(--state-error); border:1px solid var(--state-error); background:transparent;">退出登录</button>
               <button id="btn-chgpw" class="ml-1 text-xs px-2 py-1 rounded"
                       style="color:var(--color-primary-600); border:1px solid var(--color-primary-200); background:transparent;">改密码</button>`);
            document.getElementById('btn-logout').onclick = async ()=>{
              await _origFetch('/api/auth/logout',{method:'POST',credentials:'include'}); alert('已退出'); location.reload();
            };
            document.getElementById('btn-chgpw').onclick = async ()=>{
              const oldP = prompt('输入旧密码:'); if(!oldP) return;
              const newP = prompt('输入新密码 (至少6位):'); if(!newP || newP.length<6) return alert('密码太短');
              try{
                const r = await _origFetch('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({old_password:oldP,new_password:newP}),credentials:'include'});
                const d = await r.json();
                alert(d.detail || '密码已更新');
              }catch(e){ alert('请求失败'); }
            };
          }
        }
      }
    }catch(e){}
  })();

  async function loadExams(){
    const r=await fetch(API+'/stats/exams');
    const exams=await r.json();
    const sel=$('exam-select'); sel.innerHTML='';
    exams.forEach(ex=>{
      const o=document.createElement('option'); o.value=ex.id;
      o.textContent=`${ex.school_year||''} ${ex.semester||''} ${ex.name}`.trim();
      o.dataset.sy = ex.school_year||''; o.dataset.sm = ex.semester||'';
      sel.appendChild(o);
    });
    sel.onchange = onExamChange;
    // sy/sm
    const sySet=[...new Set(exams.map(e=>e.school_year).filter(Boolean))].sort();
    $('sy-select').innerHTML='<option value="">自动</option>'+sySet.map(y=>`<option value="${y}">${y}</option>`).join('');
    $('sm-select').innerHTML='<option value="">自动</option><option value="第一学期">第一学期</option><option value="第二学期">第二学期</option>';
    onExamChange();
  }
  function onExamChange(){
    const opt = $('exam-select').selectedOptions[0];
    if(opt && opt.dataset.sy){ $('sy-select').value = opt.dataset.sy; }
    if(opt && opt.dataset.sm){ $('sm-select').value = opt.dataset.sm; }
  }
  async function runQuery(){
    state.examId = parseInt($('exam-select').value);
    state.sy = $('sy-select').value || null; state.sm = $('sm-select').value || null;
    if(!state.examId || !state.sy || !state.sm){ alert('请选考试/学年/学期'); return; }
    const url = `${API}/stats/teachers?exam_id=${state.examId}&school_year=${encodeURIComponent(state.sy)}&semester=${encodeURIComponent(state.sm)}`;
    $('result-section').classList.add('hidden');
    $('empty-hint').textContent='查询中...';
    try{
      const r = await fetch(url); if(!r.ok){ $('empty-hint').textContent='失败: '+r.status; return; }
      const d = await r.json(); state.items = d.items || [];
      render();
    }catch(e){ $('empty-hint').textContent='异常: '+e.message; }
  }
  function render(){
    const sec = $('result-section'); sec.innerHTML='';
    const items = state.items.filter(t => t.subjects && t.subjects.length > 0)
                             .sort((a,b) => b.subjects.length - a.subjects.length);
    if(!items.length){ $('empty-hint').textContent='此学期无任课教师数据'; return; }
    $('empty-hint').classList.add('hidden'); sec.classList.remove('hidden');
    items.forEach(t => {
      const card = document.createElement('div');
      card.className = 'rounded-xl p-5';
      card.style.cssText = 'background:var(--color-neutral-0); border:1px solid var(--color-neutral-200);';
      // 汇总: 各科平均参考/均分/及格率
      const subs = t.subjects.filter(s => s['参考'] > 0);
      const avgRate = subs.length ? (subs.reduce((a,b)=>a+b['及格率'],0) / subs.length * 100).toFixed(1) : '0.0';
      const avgMean = subs.length ? (subs.reduce((a,b)=>a+b['平均分'],0) / subs.length).toFixed(1) : '0.0';
      const totalRef = subs.reduce((a,b)=>a+b['参考'],0);
      card.innerHTML = `
        <div class="flex items-center justify-between mb-3">
          <div>
            <h3 class="text-base font-semibold" style="color:var(--color-neutral-900);">${t.teacher_name}</h3>
            <span class="text-xs" style="color:var(--color-neutral-500);">教 ${subs.length} 个科目 · 总参考 ${totalRef} 人 · 平均及格率 ${avgRate}% · 平均均分 ${avgMean}</span>
          </div>
        </div>
        <table class="w-full text-sm">
          <thead class="text-xs" style="color:var(--color-neutral-500);">
            <tr>
              <th class="text-left py-1">科目</th>
              <th class="text-right py-1">班级数</th>
              <th class="text-right py-1">参考</th>
              <th class="text-right py-1">及格</th>
              <th class="text-right py-1">及格率</th>
              <th class="text-right py-1">平均分</th>
              <th class="text-right py-1">优秀率</th>
            </tr>
          </thead>
          <tbody>
            ${subs.map(s => {
              const rate = (s['及格率']*100).toFixed(1);
              const rateColor = s['及格率']>=0.8?'color:#16a34a':s['及格率']>=0.6?'color:#4338ca':'color:#d97706';
              const classes = [...new Set(s.class_ids)].length;
              return `<tr style="border-top:1px solid var(--color-neutral-100);">
                <td class="py-1 font-medium">${s.subject_id}</td>
                <td class="text-right py-1">${classes}</td>
                <td class="text-right py-1">${s['参考']}</td>
                <td class="text-right py-1">${s['及格']}</td>
                <td class="text-right py-1 font-medium" style="${rateColor};">${rate}%</td>
                <td class="text-right py-1">${s['平均分']}</td>
                <td class="text-right py-1">${(s['优秀率']*100).toFixed(1)}%</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>`;
      sec.appendChild(card);
    });
  }
  function exportCsv(){
    const rows=[['教师','科目','班级数','参考','及格','及格率%','平均分','优秀率%']];
    state.items.forEach(t => {
      (t.subjects||[]).forEach(s => {
        rows.push([t.teacher_name, s.subject_id, [...new Set(s.class_ids)].length, s['参考'], s['及格'],
          (s['及格率']*100).toFixed(1), s['平均分'], (s['优秀率']*100).toFixed(1)]);
      });
    });
    const csv='\\ufeff'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url;
    a.download=`教师视图_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }
  document.addEventListener('DOMContentLoaded', ()=>{
    loadExams();
    $('btn-run').onclick = runQuery;
    $('btn-reset').onclick = ()=>{ $('exam-select').selectedIndex = 0; $('sy-select').value=''; $('sm-select').value=''; $('result-section').classList.add('hidden'); };
    $('btn-export').onclick = exportCsv;
  });
})();
</script>
</body>
</html>
