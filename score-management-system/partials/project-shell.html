<!-- Project Shell: Sidebar + Header + Content Slot -->
<!-- App-shell layout for score management admin system -->

<div data-viewport-mode="app-shell" class="flex h-screen overflow-hidden min-h-0" style="font-family: var(--font-body);">

  <!-- ====== Left Sidebar (240px) ====== -->
  <aside class="shrink-0 flex flex-col h-full" style="width: 240px; background-color: var(--color-neutral-800);">

    <!-- Logo / System Name -->
    <div class="flex items-center gap-3 px-5 py-4" style="border-bottom: 1px solid rgba(255,255,255,0.08);">
      <div class="shrink-0 flex items-center justify-center" style="width: 32px; height: 32px; background-color: var(--primary); border-radius: var(--radius-md);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c0 1.657 2.686 3 6 3s6-1.343 6-3v-5"/>
        </svg>
      </div>
      <span class="truncate" style="color: #f8fafc; font-size: 15px; font-weight: 600; line-height: 1.2;">成绩管理系统</span>
    </div>

    <!-- Navigation Menu -->
    <nav class="flex-1 min-h-0 overflow-y-auto px-3 py-3" style="scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent;">

      <ul class="flex flex-col gap-1">

        <!-- 系统仪表盘 -->
        <li>
          <a href="#" data-dom-id="nav-dashboard" data-active="true"
             class="nav-item active flex items-center gap-3 px-3 py-2 rounded-lg truncate transition-colors"
             style="color: #818cf8; background-color: rgba(79,70,229,0.15);">
            <svg class="shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span class="truncate" style="font-size: 14px; font-weight: 500;">系统仪表盘</span>
          </a>
        </li>

        <!-- 数据导入 -->
        <li>
          <a href="#" data-dom-id="nav-data-import"
             class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg truncate transition-colors"
             style="color: #94a3b8;">
            <svg class="shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <span class="truncate" style="font-size: 14px; font-weight: 500;">数据导入</span>
          </a>
        </li>

        <!-- 课表管理 -->
        <li>
          <a href="timetable.html" data-dom-id="nav-timetable"
             class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg truncate transition-colors"
             style="color: #94a3b8;">
            <svg class="shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <span class="truncate" style="font-size: 14px; font-weight: 500;">课表管理</span>
          </a>
        </li>

        <!-- 成绩管理 -->
        <li>
          <a href="#" data-dom-id="nav-score-management"
             class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg truncate transition-colors"
             style="color: #94a3b8;">
            <svg class="shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
              <line x1="8" y1="12" x2="16" y2="12"/>
              <line x1="8" y1="16" x2="14" y2="16"/>
            </svg>
            <span class="truncate" style="font-size: 14px; font-weight: 500;">成绩管理</span>
          </a>
        </li>

        <!-- 奖学金评定 -->
        <li>
          <a href="#" data-dom-id="nav-scholarship"
             class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg truncate transition-colors"
             style="color: #94a3b8;">
            <svg class="shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="6"/>
              <path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/>
            </svg>
            <span class="truncate" style="font-size: 14px; font-weight: 500;">奖学金评定</span>
          </a>
        </li>

        <!-- 数据导出 -->
        <li>
          <a href="#" data-dom-id="nav-data-export"
             class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg truncate transition-colors"
             style="color: #94a3b8;">
            <svg class="shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <span class="truncate" style="font-size: 14px; font-weight: 500;">数据导出</span>
          </a>
        </li>

        <!-- 备份还原 -->
        <li>
          <a href="#" data-dom-id="nav-backup-restore"
             class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg truncate transition-colors"
             style="color: #94a3b8;">
            <svg class="shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <ellipse cx="12" cy="5" rx="9" ry="3"/>
              <path d="M3 5v6c0 1.657 4.03 3 9 3s9-1.343 9-3V5"/>
              <path d="M3 11v6c0 1.657 4.03 3 9 3s9-1.343 9-3v-6"/>
            </svg>
            <span class="truncate" style="font-size: 14px; font-weight: 500;">备份还原</span>
          </a>
        </li>

        <!-- 系统设置 -->
        <li>
          <a href="#" data-dom-id="nav-system-settings"
             class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg truncate transition-colors"
             style="color: #94a3b8;">
            <svg class="shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
            <span class="truncate" style="font-size: 14px; font-weight: 500;">系统设置</span>
          </a>
        </li>

      </ul>
    </nav>

    <!-- Bottom: User Info -->
    <div class="shrink-0 flex items-center gap-3 px-4 py-3" style="border-top: 1px solid rgba(255,255,255,0.08);">
      <div class="shrink-0 flex items-center justify-center" style="width: 34px; height: 34px; background-color: rgba(79,70,229,0.25); border-radius: var(--radius-full);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <div class="flex flex-col min-w-0">
        <span class="truncate" style="color: #f8fafc; font-size: 13px; font-weight: 500;">管理员</span>
        <span class="truncate" style="color: #64748b; font-size: 12px;">admin@school.edu</span>
      </div>
    </div>
  </aside>

  <!-- ====== Main Area (Sidebar + Header + Content) ====== -->
  <div class="flex flex-col flex-1 min-h-0 min-w-0">

    <!-- Top Header (56px) -->
    <header class="shrink-0 flex items-center justify-between px-6" style="height: 56px; background-color: var(--card); border-bottom: 1px solid var(--border);">
      <!-- Left: Page Title Slot -->
      <h1 class="truncate" style="font-size: 16px; font-weight: 600; color: var(--foreground);">
        <!-- SLOT: pageTitle -->
      </h1>

      <!-- Right: Actions -->
      <div class="flex items-center gap-3 shrink-0">
        <!-- Notification Bell -->
        <button class="flex items-center justify-center" style="width: 36px; height: 36px; border-radius: var(--radius-md); color: var(--muted-foreground);" aria-label="通知">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </button>

        <!-- User Avatar -->
        <div class="shrink-0 flex items-center justify-center" style="width: 34px; height: 34px; background-color: var(--primary); border-radius: var(--radius-full);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
      </div>
    </header>

    <!-- Main Content Scroll Region -->
    <div data-scroll-region="primary" class="flex-1 min-h-0 overflow-y-auto" style="background-color: var(--background);">
      <div class="p-6">
        <!-- SLOT: main-content -->
      </div>
    </div>
  </div>
</div>
